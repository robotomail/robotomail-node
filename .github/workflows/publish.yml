name: Publish package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching the package version, e.g. v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: package-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: package-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3.12 scripts/check_release.py
      - run: python3.12 scripts/generate.py --check
      - name: Test and build
        run: |
          npm ci
          npm test
          npm pack --dry-run
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm publish --access public
